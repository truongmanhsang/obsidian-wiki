services:
  obsidian-memory:
    build: .
    container_name: obsidian-memory
    restart: unless-stopped
    ports:
      # Keep the local MCP endpoint off the network by default.
      - "127.0.0.1:8765:8765"
    environment:
      # Internal mount path mapped to the vault below
      - OBSIDIAN_VAULT_PATH=/vault
      # Internal path for the job queue SQLite database
      - WIKI_JOB_DB=/data/jobs.db
      # Multilingual semantic index; override in .env for a different model.
      - OBSIDIAN_WIKI_EMBEDDING_MODEL=${OBSIDIAN_WIKI_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - OBSIDIAN_WIKI_EMBEDDING_THRESHOLD=${OBSIDIAN_WIKI_EMBEDDING_THRESHOLD:-0.25}
      # Reflection uses the existing Codex CLI OAuth session when selected.
      - OBSIDIAN_MEMORY_REFLECT_PROVIDER=${OBSIDIAN_MEMORY_REFLECT_PROVIDER:-hermes}
      - OBSIDIAN_MEMORY_REFLECT_MODEL=${OBSIDIAN_MEMORY_REFLECT_MODEL:-}
      - CODEX_AUTH_PATH=/root/.codex/auth.json
    volumes:
      # Set OBSIDIAN_VAULT_HOST_PATH to the host vault before starting.
      - ${OBSIDIAN_VAULT_HOST_PATH:?Set OBSIDIAN_VAULT_HOST_PATH to the host vault}:/vault
      # Persist the job database outside the container
      - obsidian-memory-data:/data
      # Read Hermes session state for the centralized ingest worker.
      - ${HERMES_STATE_DB_HOST_PATH:?Set HERMES_STATE_DB_HOST_PATH to the host Hermes state database}:/root/.hermes/state.db:ro
      # Read the existing Codex CLI login; Codex CLI owns token refreshes.
      - ${CODEX_AUTH_HOST_PATH:?Set CODEX_AUTH_HOST_PATH to the Codex CLI auth file}:/root/.codex/auth.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  obsidian-memory-data:
