services:
  obsidian-memory:
    image: obsidian-memory:local
    build: .
    container_name: obsidian-memory
    restart: unless-stopped
    ports:
      # Keep the local MCP endpoint off the network by default.
      - "127.0.0.1:8765:8765"
    environment:
      # Internal mount path mapped to the vault below
      - OBSIDIAN_VAULT_PATH=/vault
      # Read-only status DB written by the Hermes plugin on the host.
      - WIKI_JOB_DB=/ingest-state/jobs.db
      # Multilingual semantic index; override in .env for a different model.
      - OBSIDIAN_WIKI_EMBEDDING_MODEL=${OBSIDIAN_WIKI_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - OBSIDIAN_WIKI_EMBEDDING_THRESHOLD=${OBSIDIAN_WIKI_EMBEDDING_THRESHOLD:-0.25}
      # Reflection calls an OpenAI-compatible API directly; Hermes is not needed.
      - OBSIDIAN_MEMORY_REFLECT_PROVIDER=${OBSIDIAN_MEMORY_REFLECT_PROVIDER:-openai}
      - OBSIDIAN_MEMORY_REFLECT_MODEL=${OBSIDIAN_MEMORY_REFLECT_MODEL:-}
      - OBSIDIAN_MEMORY_API_KEY=${OBSIDIAN_MEMORY_API_KEY:-}
      - OBSIDIAN_MEMORY_API_BASE_URL=${OBSIDIAN_MEMORY_API_BASE_URL:-https://api.openai.com/v1}
      - CODEX_AUTH_PATH=/root/.codex/auth.json
    volumes:
      # Set OBSIDIAN_VAULT_HOST_PATH to the host vault before starting.
      - ${OBSIDIAN_VAULT_HOST_PATH:?Set OBSIDIAN_VAULT_HOST_PATH to the host vault}:/vault
      # Used only when OBSIDIAN_MEMORY_REFLECT_PROVIDER=codex; unrelated to Hermes auth.
      - ${CODEX_AUTH_HOST_PATH:?Set CODEX_AUTH_HOST_PATH to the Codex CLI auth file}:/root/.codex/auth.json:ro
      # Ingest is owned by the Hermes plugin; MCP only reads its status DB.
      - ./.state:/ingest-state:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  obsidian-memory-web:
    image: obsidian-memory:local
    container_name: obsidian-memory-web
    restart: unless-stopped
    command:
      - python
      - web_api.py
      - --host
      - 0.0.0.0
      - --port
      - "8787"
    depends_on:
      obsidian-memory:
        condition: service_healthy
    ports:
      # Keep the operations workspace local to this machine by default.
      - "127.0.0.1:8787:8787"
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      - WIKI_JOB_DB=/ingest-state/jobs.db
      - OBSIDIAN_WIKI_EMBEDDING_MODEL=${OBSIDIAN_WIKI_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - OBSIDIAN_WIKI_EMBEDDING_THRESHOLD=${OBSIDIAN_WIKI_EMBEDDING_THRESHOLD:-0.25}
      - OBSIDIAN_MEMORY_REFLECT_PROVIDER=${OBSIDIAN_MEMORY_REFLECT_PROVIDER:-openai}
      - OBSIDIAN_MEMORY_REFLECT_MODEL=${OBSIDIAN_MEMORY_REFLECT_MODEL:-}
      - OBSIDIAN_MEMORY_API_KEY=${OBSIDIAN_MEMORY_API_KEY:-}
      - OBSIDIAN_MEMORY_API_BASE_URL=${OBSIDIAN_MEMORY_API_BASE_URL:-https://api.openai.com/v1}
      - CODEX_AUTH_PATH=/root/.codex/auth.json
    volumes:
      # The web process reads the same canonical vault and plugin-owned ingest status.
      - ${OBSIDIAN_VAULT_HOST_PATH:?Set OBSIDIAN_VAULT_HOST_PATH to the host vault}:/vault
      - ${CODEX_AUTH_HOST_PATH:?Set CODEX_AUTH_HOST_PATH to the Codex CLI auth file}:/root/.codex/auth.json:ro
      - ./.state:/ingest-state:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
