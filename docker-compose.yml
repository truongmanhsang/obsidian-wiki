x-memory-environment: &memory-environment
  OBSIDIAN_VAULT_PATH: /vault
  WIKI_JOB_DB: /data/jobs.db
  OBSIDIAN_MEMORY_REFLECT_PROVIDER: ${OBSIDIAN_MEMORY_REFLECT_PROVIDER:-hermes}
  OBSIDIAN_MEMORY_REFLECT_MODEL: ${OBSIDIAN_MEMORY_REFLECT_MODEL:-}
  CODEX_AUTH_PATH: /root/.codex/auth.json

x-memory-volumes: &memory-volumes
  - ${OBSIDIAN_VAULT_HOST_PATH:?Set OBSIDIAN_VAULT_HOST_PATH to the host vault}:/vault
  - obsidian-memory-data:/data
  - ${HERMES_STATE_DB_HOST_PATH:?Set HERMES_STATE_DB_HOST_PATH to the host Hermes state database}:/root/.hermes/state.db:ro
  - ${CODEX_AUTH_HOST_PATH:?Set CODEX_AUTH_HOST_PATH to the Codex CLI auth file}:/root/.codex/auth.json:ro

services:
  obsidian-memory:
    build: .
    container_name: obsidian-memory
    restart: unless-stopped
    ports:
      # Keep the local MCP endpoint off the network by default.
      - "127.0.0.1:8765:8765"
    environment: *memory-environment
    volumes: *memory-volumes
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  obsidian-memory-web-api:
    build: .
    container_name: obsidian-memory-web-api
    restart: unless-stopped
    command: ["python", "-m", "web_api", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "127.0.0.1:8787:8787"
    environment: *memory-environment
    volumes: *memory-volumes
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  obsidian-memory-web:
    build: ./web
    container_name: obsidian-memory-web
    restart: unless-stopped
    depends_on:
      obsidian-memory-web-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  obsidian-memory-data:
