name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Provide Hermes imports used by provider tests
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git ../hermes-agent
      - name: Run tests
        run: PYTHONPATH=../hermes-agent:. OBSIDIANWIKI_PLUGIN_DIR="$GITHUB_WORKSPACE" python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q .
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel contents
        run: python scripts/verify_wheel.py dist/*.whl
